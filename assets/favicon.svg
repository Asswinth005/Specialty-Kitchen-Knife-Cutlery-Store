<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="emberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C57D52"/>
      <stop offset="100%" stop-color="#9C5933"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="bladeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Copper-Ember Brand Badge -->
  <rect width="100" height="100" rx="24" fill="url(#emberGrad)"/>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2.5"/>

  <!-- Master Japanese Chef Knife (Diagonal 45°) -->
  <g transform="rotate(-45 50 50)" filter="url(#bladeShadow)">
    <!-- Ergonomic Ebony Handle -->
    <path d="M 13,45 C 13,43 15,42 19,42.5 L 36,44.5 L 36,55.5 L 19,57.5 C 15,58 13,57 13,55 Z" fill="#181513"/>
    <path d="M 14,44.5 L 36,45.5 L 36,47 L 14,46 Z" fill="#3D3631" opacity="0.6"/>
    <!-- Brass Handle Rivets -->
    <circle cx="20" cy="50" r="1.8" fill="#E6AA68"/>
    <circle cx="29" cy="50" r="1.8" fill="#E6AA68"/>
    <!-- Stainless Steel Bolster -->
    <rect x="36" y="42.5" width="5" height="15.5" rx="1.5" fill="#F1F5F9"/>
    <rect x="38" y="42.5" width="1.5" height="15.5" fill="#94A3B8"/>
    <!-- Chef Knife Blade (Gyuto Profile) -->
    <path d="M 41,43 L 75,43.8 L 89,46.5 C 78,52 64,57 41,59.5 Z" fill="url(#bladeGrad)"/>
    <!-- Honed Razor Edge Bevel -->
    <path d="M 41,55 C 62,53.5 76,49.5 89,46.5 C 78,52 64,57 41,59.5 Z" fill="url(#edgeGrad)"/>
    <!-- Blade Shine Highlight -->
    <polygon points="50,43.2 55,43.3 47,57 43,57" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <!-- Razor Sharp Sparkle / Ember Glint -->
  <path d="M 80,16 Q 80,23 87,23 Q 80,23 80,30 Q 80,23 73,23 Q 80,23 80,16 Z" fill="#FFFDF5"/>
  <circle cx="80" cy="23" r="1.5" fill="#FFE29A"/>
</svg>
